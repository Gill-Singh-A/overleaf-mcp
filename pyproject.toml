[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overleaf-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code and other MCP clients read, edit and compile projects on a self-hosted Overleaf instance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]
keywords = ["overleaf", "latex", "mcp", "claude", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
overleaf-mcp = "overleaf_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: talks to a live Overleaf instance (needs OVERLEAF_* credentials)"]
